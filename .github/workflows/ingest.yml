name: Scheduled Environmental Ingestion

on:
  schedule:
    - cron: '*/30 * * * *' # Ejecuta cada 30 minutos
  workflow_dispatch: # Permite ejecución manual desde la web de GitHub

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          response=$(curl -s -w "\n%{http_code}" "$APP_URL/api/ingest" \
            -H "Authorization: Bearer $INGEST_SECRET")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Ingest failed with HTTP $http_code"
            exit 1
          fi
